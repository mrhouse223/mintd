# Netlify config for mintd.money.
#
# This is the SECOND site built from this repo. mintd.fun is configured by the
# netlify.toml at the repo root and publishes `frontend/`. This one is reached
# by setting the Netlify site's base directory to `money`, which makes Netlify
# read this file instead of the root one and treat paths as relative to here.
#
# Both sites rebuild on every push to main. That is harmless, and it keeps the
# contracts, docs and deploy records in one place rather than duplicated.
[build]
  publish = "."
  command = ""

# The landing copy lives at /about. This must come BEFORE the catch-all, since
# Netlify applies the first matching rule.
[[redirects]]
  from = "/about"
  to = "/landing.html"
  status = 200

# Arc reads for visitors with no wallet.
#
# No public Arc RPC exists: every endpoint tried either 500s, reports the chain
# as unknown, or resolves to nothing. The block explorer's API does answer
# eth_call, which is all the coin list needs, but it sends no
# Access-Control-Allow-Origin header, so a browser cannot call it cross-origin.
#
# status 200 makes this a PROXY rather than a redirect: Netlify fetches upstream
# server-side and returns the body from this origin, so the browser sees a
# same-origin request and CORS never applies. It must come before the catch-all,
# which would otherwise swallow it and hand back index.html.
#
# Read-only by construction. The upstream only exposes queries, so nothing here
# can move funds, and a visitor's wallet is still what signs every transaction.
[[redirects]]
  from = "/arcapi/*"
  to = "https://api.arc.exploreme.pro/api/:splat"
  status = 200
  force = true

# The bare path, without which a request to "/arcapi" would fall through to the
# catch-all and be answered with index.html: JSON.parse would then fail on HTML
# and the coin list would look like an upstream outage.
[[redirects]]
  from = "/arcapi"
  to = "https://api.arc.exploreme.pro/api"
  status = 200
  force = true

# Clean URLs, same reasoning as the root config: the host must answer /vaults
# and /docs with the app rather than a 404, and status 200 rather than 301 so
# the URL stays as the visitor typed it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The HTML carries live contract addresses, so a cached copy could point
# somebody at the wrong contract. Always revalidate.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# This site will hold user funds. Ask browsers to keep it on HTTPS and refuse
# to be framed, which is the cheapest defence against a wallet-drainer iframe.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
