<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mintd.money">
  <!-- mintd.money mark: two overlapping M / mountain strokes, white on the
       brand green. Rebuilt as vector so it stays sharp at any size and needs
       no raster asset. -->
  <rect width="512" height="512" rx="112" fill="#22c98a"/>
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- back stroke, shifted left -->
    <path d="M 150 372 L 214 168 L 256 300 L 298 168 L 362 372"/>
    <!-- front stroke, shifted right, overlaps the center to form the tall apex -->
    <path d="M 214 372 L 278 168 L 320 300 L 362 168 L 426 372" opacity="0.96"/>
  </g>
</svg>
