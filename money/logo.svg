<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ArcSwap">
  <!-- ArcSwap mark: white angular "A" whose crossbar is a swoosh, on a blue
       tile, from the supplied artwork. Replaces the "as" monogram.
       Full-bleed square rather than a rounded tile: the containers that show it
       round their own corners, and arcswap now runs a squared-off treatment, so
       a radius baked into the asset would fight the CSS.
       #0e62c8 is the artwork's own blue, deeper than the #1a73e8 the UI uses for
       accents. Deliberate: this is a logo tile, not a UI surface, and matching
       the supplied mark matters more than matching a button. -->
  <title>ArcSwap</title>
  <rect width="512" height="512" fill="#0e62c8"/>
  <g fill="#ffffff">
    <!-- The A as a lambda: apex, down both legs to sharp points, back up the
         inner edges to the counter's apex. The outer bottom points sit wider
         than the inner ones so each leg tapers to a blade instead of ending
         square, which is what makes the mark read as angular rather than blocky. -->
    <path d="M256 58
             L486 452
             L364 452
             L256 250
             L148 452
             L26 452
             Z"/>
    <!-- The swoosh, doing the crossbar's job. It has to run FLAT under the
         counter before it lifts, or it reads as a separate tick floating beside
         the letter rather than closing it, which is exactly how a steeper first
         attempt failed. It overshoots the right leg the way the source does. -->
    <path d="M146 332
             C258 340 366 322 474 168
             C436 306 302 366 146 332
             Z"/>
  </g>
</svg>
