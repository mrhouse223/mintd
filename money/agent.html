<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent vaults – mintd.money</title>
<link rel="icon" href="logo.svg" />
<style>
  /* Palette lifted from frontend/index.html so this page belongs to the same
     product rather than looking like a tool bolted on beside it. */
  :root {
    --bg: #ffffff; --panel: #ffffff; --panel2: #f2f5f9; --line: #e6ebf2;
    --ink: #0b1119; --dim: #6b7a8d; --accent: #2f7fe0; --accent-soft: #e8f1fd;
    --up: #12a05f; --up-soft: rgba(18,160,95,.13);
    --red: #e0483d; --red-soft: rgba(224,72,61,.12);
    --gold: #b8891f; --gold-soft: #f8f0dc;
    --radius: 14px; --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1119; --panel: #121a25; --panel2: #172130; --line: #22303f;
      --ink: #e8eef6; --dim: #8b9cb0; --accent: #5b9df0; --accent-soft: #16283f;
      --gold-soft: #2a2416;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--dim); font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-top: 20px;
  }
  .cardhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; background: var(--panel2); color: var(--dim);
  }
  .badge.on { background: var(--up-soft); color: var(--up); }
  .badge.warn { background: var(--gold-soft); color: var(--gold); }
  .badge.off { background: var(--red-soft); color: var(--red); }

  .value { display: flex; align-items: baseline; gap: 12px; margin: 18px 0 6px; flex-wrap: wrap; }
  /* Financial figures are never truncated here: no ellipsis, no fixed width.
     A clipped number is worse than a wrapped one. */
  .value .big { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .delta { font-family: var(--mono); font-size: 14px; font-weight: 600; padding: 3px 8px; border-radius: 8px; }
  .delta.up { background: var(--up-soft); color: var(--up); }
  .delta.down { background: var(--red-soft); color: var(--red); }
  .delta.flat { background: var(--panel2); color: var(--dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 18px; }
  .kv .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kv .v { font-family: var(--mono); font-size: 14px; margin-top: 3px; word-break: break-all; }

  .rangebar { margin-top: 20px; }
  .rangebar .track {
    position: relative; height: 40px; background: var(--panel2);
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  }
  /* Solid enough to read as "this is the position" in dark mode too, where the
     soft tint alone was almost indistinguishable from the track behind it. */
  .rangebar .band { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .28; border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .rangebar .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .rangebar .now::after {
    content: ""; position: absolute; top: -3px; left: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--ink);
  }
  .rangelabels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 6px; }

  .chart { margin-top: 22px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .scroll { overflow-x: auto; margin-top: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 640px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); white-space: nowrap; }
  .evt { font-weight: 600; }
  .evt.reb { color: var(--accent); }
  .evt.dep { color: var(--up); }
  .evt.halt { color: var(--red); }
  .muted { color: var(--dim); }
  .note { background: var(--gold-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 20px; font-size: 13px; }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Agent vaults</h1>
    <span class="sub" id="meta">loading…</span>
  </header>
  <div class="sub">Agent-managed Uniswap V3 positions. The agent proposes timing; the vault decides every value-carrying parameter from a TWAP.</div>
  <div id="out"><div class="empty">loading…</div></div>
</div>

<script>
const EXPLORER = "https://testnet.arcscan.app";
const fmtAddr = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Values arrive as raw integer strings in the numeraire's own decimals. Format
// with full precision rather than rounding to a fixed 2dp: these are financial
// figures and a rebalance that costs 0.000437 must not display as 0.00.
function fmtUnits(raw, dec, maxFrac) {
  if (raw === null || raw === undefined) return "–";
  const neg = String(raw).startsWith("-");
  const s = String(raw).replace("-", "").padStart(dec + 1, "0");
  const whole = s.slice(0, s.length - dec) || "0";
  let frac = dec ? s.slice(s.length - dec) : "";
  if (maxFrac !== undefined) frac = frac.slice(0, maxFrac);
  frac = frac.replace(/0+$/, "");
  const w = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + w + (frac ? "." + frac : "");
}

/// Uniswap ticks are log-scale; a dashboard showing only raw ticks tells you
/// nothing about the price the position actually covers.
function priceAt(tick, d0, d1) {
  const p = Math.pow(1.0001, tick) * Math.pow(10, d0 - d1);
  if (!isFinite(p) || p === 0) return "–";
  if (p >= 1000) return p.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (p >= 1) return p.toFixed(3);
  return p.toPrecision(4);
}

const when = (t) => {
  const d = new Date(t * 1000);
  const ago = Math.floor(Date.now() / 1000) - t;
  const rel = ago < 60 ? `${ago}s` : ago < 3600 ? `${Math.floor(ago / 60)}m` : ago < 86400 ? `${Math.floor(ago / 3600)}h` : `${Math.floor(ago / 86400)}d`;
  return `<span class="num">${d.toISOString().slice(5, 16).replace("T", " ")}</span> <span class="muted">${rel} ago</span>`;
};

/// Every point the chain actually recorded, in order. Rebalanced carries the
/// value on both sides of the action, which is what makes the cost of a trade
/// visible rather than inferred.
function valueSeries(v) {
  const pts = [];
  for (const e of v.events) {
    if (e.name === "Rebalanced") {
      pts.push({ t: e.time, v: Number(e.args[2]), label: "before rebalance" });
      pts.push({ t: e.time, v: Number(e.args[3]), label: "after rebalance" });
    }
  }
  if (v.value !== null && v.value !== undefined) {
    pts.push({ t: v.updatedAt || Math.floor(Date.now() / 1000), v: Number(v.value), label: "now" });
  }
  return pts;
}

function chart(pts, dec, sym) {
  if (pts.length < 2) return `<div class="note">Not enough history to chart yet. A line appears once the agent has completed more than one rebalance.</div>`;
  const W = 900, H = 180, PL = 30, PR = 30, PT = 14, PB = 30;
  const ys = pts.map((p) => p.v);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  // A flat-ish series would otherwise render as a line pinned to an edge, which
  // reads as "no data" rather than "stable".
  const pad = (y1 - y0) * 0.25 || Math.max(1, y1 * 0.0002);
  y0 -= pad; y1 += pad;
  // Spaced by SEQUENCE, not timestamp. A rebalance emits its before and after
  // values in the same block, so on a time axis those two points share an x and
  // collapse into a vertical cliff at the left edge, with a long flat line to
  // "now" that makes a 0.011% cost look like a crash. Order is what matters
  // here; the exact spacing between events is not the story.
  const X = (i) => PL + (pts.length === 1 ? (W - PL - PR) / 2 : (i / (pts.length - 1)) * (W - PL - PR));
  const Y = (v) => PT + (1 - (v - y0) / (y1 - y0 || 1)) * (H - PT - PB);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area = `${d} L${X(pts.length - 1).toFixed(1)},${H - PB} L${X(0).toFixed(1)},${H - PB} Z`;
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"><title>${fmtUnits(p.v, dec)} ${esc(sym)} – ${esc(p.label)}</title></circle>`).join("");
  const tags = pts.map((p, i) => {
    if (pts.length > 8 && i % 2) return "";
    const anchor = i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle";
    return `<text x="${X(i).toFixed(1)}" y="${H - 12}" font-size="10" fill="var(--dim)" text-anchor="${anchor}">${esc(p.label)}</text>`;
  }).join("");
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vault value over time">
      <path d="${area}" fill="var(--accent-soft)" />
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
      ${dots}
      ${tags}
      <text x="${PL}" y="${PT + 4}" font-size="10" fill="var(--dim)" text-anchor="end" font-family="var(--mono)">${fmtUnits(Math.round(y1), dec, 4)}</text>
      <text x="${PL}" y="${H - PB}" font-size="10" fill="var(--dim)" text-anchor="end" font-family="var(--mono)">${fmtUnits(Math.round(y0), dec, 4)}</text>
      <text x="${W - PR + 4}" y="${PT + 4}" font-size="10" fill="var(--dim)" font-family="var(--mono)">${esc(sym)}</text>
    </svg>
  </div>`;
}

function rangeBar(v) {
  if (!v.position) return "";
  const { tickLower: lo, tickUpper: hi } = v.position;
  const t = v.tick;
  // Show a margin either side so a tick sitting outside the range is still
  // visible on the bar instead of being clamped invisibly to an edge.
  const span = hi - lo, m = span * 0.35;
  const vmin = Math.min(lo - m, t - span * 0.05), vmax = Math.max(hi + m, t + span * 0.05);
  const pct = (x) => ((x - vmin) / (vmax - vmin)) * 100;
  const d0 = v.token0.decimals, d1 = v.token1.decimals;
  return `<div class="rangebar">
    <div class="track">
      <div class="band" style="left:${pct(lo).toFixed(2)}%;width:${(pct(hi) - pct(lo)).toFixed(2)}%"></div>
      <div class="now" style="left:${pct(t).toFixed(2)}%" title="current tick ${t}"></div>
    </div>
    <div class="rangelabels">
      <span>${priceAt(lo, d0, d1)}</span>
      <span>spot ${priceAt(t, d0, d1)} ${esc(v.token1.symbol)}/${esc(v.token0.symbol)}</span>
      <span>${priceAt(hi, d0, d1)}</span>
    </div>
  </div>`;
}

function rows(v) {
  const dec = v.numeraire.decimals, sym = v.numeraire.symbol;
  const out = [];
  for (const e of [...v.events].reverse()) {
    const tx = `<a href="${EXPLORER}/tx/${e.tx}" target="_blank" rel="noopener">${e.tx.slice(0, 10)}…</a>`;
    let name = e.name, cls = "", detail = "", change = "";
    if (e.name === "Rebalanced") {
      cls = "reb"; name = "Rebalance";
      const before = BigInt(e.args[2]), after = BigInt(e.args[3]);
      const diff = after - before;
      const kind = diff > 0n ? "up" : diff < 0n ? "down" : "flat";
      const pctv = before > 0n ? (Number(diff) / Number(before)) * 100 : 0;
      detail = `range <span class="num">${e.args[0]} → ${e.args[1]}</span>`;
      change = `<span class="num">${fmtUnits(before, dec)} → ${fmtUnits(after, dec)}</span>
        <div><span class="delta ${kind}">${diff >= 0n ? "+" : ""}${fmtUnits(diff.toString(), dec)} ${esc(sym)} (${pctv >= 0 ? "+" : ""}${pctv.toFixed(3)}%)</span></div>`;
    } else if (e.name === "Deposited") {
      cls = "dep"; name = "Deposit";
      detail = `<span class="num">${fmtUnits(e.args[0], v.token0.decimals)} ${esc(v.token0.symbol)}</span> + <span class="num">${fmtUnits(e.args[1], v.token1.decimals)} ${esc(v.token1.symbol)}</span>`;
    } else if (e.name === "Withdrawn") {
      cls = "dep"; name = "Withdraw";
      detail = `<span class="num">${fmtUnits(e.args[0], v.token0.decimals)} ${esc(v.token0.symbol)}</span> + <span class="num">${fmtUnits(e.args[1], v.token1.decimals)} ${esc(v.token1.symbol)}</span>`;
    } else if (e.name === "Proposed") {
      name = "Proposed"; detail = `range <span class="num">${e.args[0]} → ${e.args[1]}</span> <span class="muted">by the agent, carries no authority on its own</span>`;
    } else if (e.name === "ModeChanged") {
      const M = ["PAUSED", "PROPOSE_ONLY", "TIMELOCKED", "AUTONOMOUS"];
      name = "Mode change"; detail = `<span class="muted">${M[e.args[0]] || e.args[0]} → </span><b>${M[e.args[1]] || e.args[1]}</b>`;
    } else if (e.name === "Halted") {
      cls = "halt"; name = "Loss breaker fired";
      detail = `value <span class="num">${fmtUnits(e.args[0], dec)}</span> fell below checkpoint <span class="num">${fmtUnits(e.args[1], dec)}</span>`;
    } else if (e.name === "Compounded") {
      name = "Compound"; detail = `fees collected <span class="num">${fmtUnits(e.args[0], v.token0.decimals)} ${esc(v.token0.symbol)}</span> + <span class="num">${fmtUnits(e.args[1], v.token1.decimals)} ${esc(v.token1.symbol)}</span>`;
    } else if (e.name === "AgentChanged") {
      name = "Agent changed"; detail = `<span class="num">${fmtAddr(e.args[0])} → ${fmtAddr(e.args[1])}</span>`;
    } else if (e.name === "Vetoed") {
      name = "Vetoed"; detail = `<span class="muted">owner cancelled the pending proposal</span>`;
    }
    out.push(`<tr>
      <td class="num">${when(e.time)}</td>
      <td class="evt ${cls}">${esc(name)}</td>
      <td>${detail}</td>
      <td class="num">${change || '<span class="muted">–</span>'}</td>
      <td class="num">${tx}</td>
    </tr>`);
  }
  return out.join("");
}

function card(v) {
  const dec = v.numeraire.decimals, sym = v.numeraire.symbol;
  const reb = v.events.filter((e) => e.name === "Rebalanced");
  // Measure against the first value the chain ever recorded for this vault, not
  // against the deposited token amounts: those are two different tokens and
  // adding them would be meaningless.
  const first = reb.length ? BigInt(reb[0].args[2]) : null;
  const now = v.value !== null ? BigInt(v.value) : null;
  let deltaHtml = '<span class="delta flat">no completed rebalance yet</span>';
  if (first !== null && now !== null) {
    const d = now - first;
    const kind = d > 0n ? "up" : d < 0n ? "down" : "flat";
    const pct = first > 0n ? (Number(d) / Number(first)) * 100 : 0;
    deltaHtml = `<span class="delta ${kind}">${d >= 0n ? "+" : ""}${fmtUnits(d.toString(), dec)} ${esc(sym)} (${pct >= 0 ? "+" : ""}${pct.toFixed(3)}%) since first rebalance</span>`;
  }
  const modeCls = v.mode === "AUTONOMOUS" ? "on" : v.mode === "PAUSED" ? "off" : "warn";
  const rangeCls = v.position ? (v.position.inRange ? "on" : "off") : "";
  return `<div class="card">
    <div class="cardhead">
      <a class="mono" href="${EXPLORER}/address/${v.address}" target="_blank" rel="noopener">${fmtAddr(v.address)}</a>
      <span class="badge ${modeCls}">${esc(v.mode)}</span>
      ${v.position ? `<span class="badge ${rangeCls}">${v.position.inRange ? "in range" : "out of range"}</span>` : '<span class="badge">no position</span>'}
      <span class="badge">${esc(v.token0.symbol)}/${esc(v.token1.symbol)} ${(v.fee / 10000).toFixed(2)}%</span>
    </div>

    <div class="value">
      <span class="big">${fmtUnits(v.value, dec)}</span>
      <span class="sub">${esc(sym)}</span>
      ${deltaHtml}
    </div>
    ${v.valueError ? `<div class="note">Value unavailable: ${esc(v.valueError)}. The vault reverts rather than reporting a number it cannot stand behind.</div>` : ""}

    ${rangeBar(v)}
    ${chart(valueSeries(v), dec, sym)}

    <div class="grid">
      <div class="kv"><div class="k">Owner</div><div class="v"><a href="${EXPLORER}/address/${v.owner}" target="_blank" rel="noopener">${fmtAddr(v.owner)}</a></div></div>
      <div class="kv"><div class="k">Agent</div><div class="v">${v.agent === "0x0000000000000000000000000000000000000000" ? '<span class="muted">revoked</span>' : `<a href="${EXPLORER}/address/${v.agent}" target="_blank" rel="noopener">${fmtAddr(v.agent)}</a>`}</div></div>
      <div class="kv"><div class="k">Rebalances</div><div class="v">${reb.length}</div></div>
      <div class="kv"><div class="k">Loss breaker</div><div class="v">${v.checkpoint === "0" ? '<span class="muted">unarmed</span>' : fmtUnits(v.checkpoint, dec) + " " + esc(sym)}</div></div>
      ${v.position ? `<div class="kv"><div class="k">Tick range</div><div class="v">${v.position.tickLower} → ${v.position.tickUpper}</div></div>
      <div class="kv"><div class="k">Liquidity</div><div class="v">${Number(v.position.liquidity).toExponential(3)}</div></div>` : ""}
    </div>

    <div class="scroll">
      <table>
        <thead><tr><th>When</th><th>Action</th><th>Detail</th><th>Value change</th><th>Tx</th></tr></thead>
        <tbody>${rows(v)}</tbody>
      </table>
    </div>
  </div>`;
}

fetch("agent-data.json?t=" + Date.now())
  .then((r) => { if (!r.ok) throw new Error("agent-data.json " + r.status); return r.json(); })
  .then((d) => {
    const vaults = Object.values(d.vaults || {});
    for (const v of vaults) v.updatedAt = d.updated;
    document.getElementById("meta").innerHTML =
      `${vaults.length} vault${vaults.length === 1 ? "" : "s"} · chain ${d.chainId} · indexed to block <span class="mono">${d.lastScanned}</span> · ${when(d.updated)}`;
    document.getElementById("out").innerHTML = vaults.length
      ? vaults.map(card).join("")
      : `<div class="empty">No vaults yet. Create one from the factory <span class="mono">${fmtAddr(d.factory)}</span>.</div>`;
  })
  .catch((e) => {
    document.getElementById("meta").textContent = "";
    document.getElementById("out").innerHTML =
      `<div class="note">Could not load <span class="mono">agent-data.json</span>: ${esc(e.message)}.<br>Run <span class="mono">node scripts/agent-indexer.js</span> to generate it.</div>`;
  });
</script>
</body>
</html>
