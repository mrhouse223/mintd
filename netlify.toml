# Netlify deploy config.
#
# The site is a single static folder with no build step, so there is nothing to
# compile: Netlify just publishes `frontend/` as-is.
[build]
  publish = "frontend"
  command = ""

# Clean URLs need the host to answer /furnace, /launch, /token/0x… with the app
# rather than a 404. Netlify serves a real file when one exists, so this only
# catches paths that are routes. Status 200, not 301: the URL must stay as the
# visitor typed it or the router has nothing to read.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# stats.json is regenerated by scripts/stats-indexer.js and must never be served
# stale, or the site shows yesterday's volume. The service worker already treats
# it as uncacheable; this makes the CDN agree.
[[headers]]
  for = "/stats.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The HTML carries live contract addresses, so a cached copy could point someone
# at the wrong contract. Always revalidate.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Images and icons are content-stable and safe to cache hard.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
